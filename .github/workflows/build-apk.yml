name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  # Lets you build on demand from the Actions tab.
  workflow_dispatch:

# Needed so the job can publish the APK to a GitHub Release.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The runner image already ships the Android SDK, so only the JDK needs
      # pinning. AGP 8.7 requires JDK 17 or newer.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          # One name, and it never changes.
          #
          # It used to be stamped with the commit, which meant every push
          # published a *different* file name and every link handed out before
          # it 404'd — including for a documentation commit that changed no
          # code. The commit is recorded in the release notes instead, where
          # being stale costs nothing.
          cp app/build/outputs/apk/debug/app-debug.apk "dist/BaselAI-latest.apk"
          ls -lh dist

      # Downloadable from the workflow run page (as a zip).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaselAI-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Also publish to a rolling pre-release so the APK can be installed
      # straight from a phone browser with one tap — no login, no unzipping.
      - name: Publish to rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Never delete the release.
          #
          # It used to be deleted and recreated, which left the download URL
          # dead for the whole publish step — and permanently dead if the run
          # was cancelled in between, which the concurrency group above does
          # on every new push. Someone following a link during that window
          # sees the file simply vanish.
          #
          # Created once if missing, then the asset is overwritten in place.
          # The URL is valid at every moment, before and after.
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug \
              --title "Latest debug build" \
              --notes "Rolling debug build." \
              --prerelease \
              --target "${GITHUB_SHA}"

          gh release upload latest-debug dist/BaselAI-latest.apk --clobber

          gh release edit latest-debug \
            --title "Latest debug build" \
            --prerelease \
            --notes "Debug APK from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`.

          Download (this link never changes):
          https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-debug/BaselAI-latest.apk

          Install: download the .apk on your phone and allow installing from
          your browser when prompted. Debug builds are signed with the standard
          debug key, so uninstall any previous copy signed differently."
