name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  # Lets you build on demand from the Actions tab.
  workflow_dispatch:

# Needed so the job can publish the APK to a GitHub Release.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The runner image already ships the Android SDK, so only the JDK needs
      # pinning. AGP 8.7 requires JDK 17 or newer.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/OnDeviceLLM-debug-${GITHUB_SHA::7}.apk"
          # A second copy under a name that never changes.
          #
          # The rolling release is deleted and recreated on every push, so a
          # link to the commit-stamped file stops working the moment anything
          # lands after it — including a documentation commit. Anyone given a
          # link then gets a 404 through no fault of their own. This one is
          # always the newest build and can be sent once.
          cp app/build/outputs/apk/debug/app-debug.apk "dist/OnDeviceLLM-latest.apk"
          ls -lh dist

      # Downloadable from the workflow run page (as a zip).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnDeviceLLM-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Also publish to a rolling pre-release so the APK can be installed
      # straight from a phone browser with one tap — no login, no unzipping.
      - name: Publish to rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug dist/*.apk \
            --title "Latest debug build" \
            --notes "Debug APK from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`.

          Permanent link (always the newest build):
          https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-debug/OnDeviceLLM-latest.apk

          Install: download the .apk on your phone and allow installing from
          your browser when prompted. Debug builds are signed with the standard
          debug key, so uninstall any previous copy signed differently." \
            --prerelease \
            --target "${GITHUB_SHA}"

      # Surfaces test/lint reports when something fails.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          retention-days: 7
