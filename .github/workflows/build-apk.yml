name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  # Lets you build on demand from the Actions tab.
  workflow_dispatch:

# Needed so the job can publish the APK to a GitHub Release.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The runner image already ships the Android SDK, so only the JDK needs
      # pinning. AGP 8.7 requires JDK 17 or newer.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Costs a second and catches two mistakes that between them broke six
      # builds: a call site passing a parameter the function doesn't have, and
      # an import naming a class that isn't there. Runs before Gradle so the
      # answer arrives in seconds rather than two minutes.
      - name: Check references
        run: ./tools/check-refs.sh

      # Every Gradle step below funnels through the same shape: capture the
      # output, and on failure print *just* the errors as the last thing in the
      # log.
      #
      # Gradle puts compile errors near the top and then buries them under two
      # hundred lines of its own stack trace, which is a trace of Gradle
      # executing a task rather than of anything wrong with this code. Reading a
      # failure meant paging back through all of it. Now the last lines of a
      # failed job are the errors themselves.
      # The `if` matters: these steps run under `bash -e`, and a bare
      # `cmd || { report; }` still exits on the failure before the report can
      # print. Putting the command in a condition is what makes the summary
      # below reachable at all.
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          if ./gradlew testDebugUnitTest 2>&1 | tee /tmp/tests.log; then exit 0; fi
          echo "::error::unit tests failed — errors follow"
          echo "----------------------------- errors -----------------------------"
          grep -E "^e: |^\s+> There were failing tests|FAILED$" /tmp/tests.log | head -60
          # Assertion messages live in the XML, not in the console output.
          grep -rhoP '(?<=<failure message=")[^"]{0,300}' \
            app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -20
          echo "------------------------------------------------------------------"
          exit 1

      - name: Build APK
        # Release rather than debug: it is the same code with the unused nine
        # tenths of the libraries removed, and the size is what decides whether
        # anyone can actually download it.
        shell: bash
        run: |
          set -o pipefail
          if ./gradlew assembleRelease 2>&1 | tee /tmp/build.log; then exit 0; fi
          echo "::error::APK build failed — errors follow"
          echo "----------------------------- errors -----------------------------"
          grep -E "^e: |^ERROR:|error: |Caused by: |^\s+> " /tmp/build.log | head -60
          echo "------------------------------------------------------------------"
          exit 1

      - name: Rename APK
        run: |
          mkdir -p dist
          # One name, and it never changes.
          #
          # It used to be stamped with the commit, which meant every push
          # published a *different* file name and every link handed out before
          # it 404'd — including for a documentation commit that changed no
          # code. The commit is recorded in the release notes instead, where
          # being stale costs nothing.
          cp app/build/outputs/apk/release/app-release.apk "dist/BaselAI-latest.apk"
          ls -lh dist

      # Downloadable from the workflow run page (as a zip).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaselAI-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Also publish to a rolling pre-release so the APK can be installed
      # straight from a phone browser with one tap — no login, no unzipping.
      - name: Publish to rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Never delete the release.
          #
          # It used to be deleted and recreated, which left the download URL
          # dead for the whole publish step — and permanently dead if the run
          # was cancelled in between, which the concurrency group above does
          # on every new push. Someone following a link during that window
          # sees the file simply vanish.
          #
          # Created once if missing, then the asset is overwritten in place.
          # The URL is valid at every moment, before and after.
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug \
              --title "Latest debug build" \
              --notes "Rolling debug build." \
              --prerelease \
              --target "${GITHUB_SHA}"

          gh release upload latest-debug dist/BaselAI-latest.apk --clobber

          gh release edit latest-debug \
            --title "Latest debug build" \
            --prerelease \
            --notes "Debug APK from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`.

          Download (this link never changes):
          https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-debug/BaselAI-latest.apk

          Install: download the .apk on your phone and allow installing from
          your browser when prompted. Debug builds are signed with the standard
          debug key, so uninstall any previous copy signed differently."
